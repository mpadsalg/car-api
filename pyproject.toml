[project]
name = "carapi"
version = "0.1.0"
description = "Car inventory REST API (FastAPI + SQLAlchemy + Postgres)"
readme = "README.md"
authors = [
    { name = "mpadsalg" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.162.5",
    "psycopg[binary]>=3.3.9",
    "pydantic-settings>=2.16.2",
    "sqlalchemy>=2.1.8",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
carapi = "carapi:main"

[build-system]
requires = ["uv_build>=0.9.11,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N"]


[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"